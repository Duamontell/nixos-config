[bar.default]
center = [ "active_window" ]
end = [ "audio_visualizer", "tray", "keyboard_layout", "network", "bluetooth", "volume", "battery", "clock", "session" ]
start = [ "launcher", "workspaces", "privacy" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 1.0

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[shell]
font_family = "Noto Sans"

    [shell.panel]
    open_near_click_launcher = true

[theme]
builtin = "Gruvbox"
community_palette = "Spiderman"
custom_palette = "stylix"
mode = "dark"
source = "builtin"

[wallpaper.default]
path = "/home/dutelik/Pictures/Wallpapers/wallhaven-jeddgq.jpg"

[wallpaper.last]
path = "/home/dutelik/Pictures/Wallpapers/wallhaven-jeddgq.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/dutelik/Pictures/Wallpapers/wallhaven-jeddgq.jpg"

[widget.clock]
format = "{:%d.%m.%y  -  %H:%M}"

[widget.network]
show_label = false

[widget.volume]
show_label = false
